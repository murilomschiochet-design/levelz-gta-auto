<!doctype html>
<html lang="it"><head><meta charset="utf-8"><title>…</title>
<style>
@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}
@font-face{font-family:Inter;src:url(fonts/Inter.ttf);font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1280px;height:720px;overflow:hidden;background:#000}
#cena{position:absolute;inset:0;background-size:cover;background-position:var(--pos,50% 40%);filter:saturate(1.25) contrast(1.08)}
#luz{position:absolute;inset:0;background:radial-gradient(ellipse at var(--luz-x,30%) 45%,rgba(255,170,80,.18),transparent 55%),
  linear-gradient(to var(--lado-sombra,right),transparent 35%,rgba(10,4,20,.55) 70%,rgba(10,4,20,.75))}
#logo{position:absolute;top:22px;left:26px;height:150px;filter:drop-shadow(4px 5px 0 rgba(30,6,56,.85))}
.lado-esq #logo{left:auto;right:26px}
#bloco{position:absolute;top:70px;right:34px;width:640px;height:560px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.lado-esq #bloco{right:auto;left:34px}
#pincel{position:absolute;inset:-10px -26px;z-index:0}
.t{position:relative;z-index:1;font-family:Anton,sans-serif;text-transform:uppercase;line-height:.95;text-align:center;
  transform:skewX(-8deg) rotate(-3deg);paint-order:stroke fill;white-space:nowrap}
#l1{font-size:var(--f1,104px);color:#fff;-webkit-text-stroke:12px #000;text-shadow:0 6px 0 #000}
#l2{font-size:var(--f2,210px);margin-top:4px;
  background:linear-gradient(180deg,#fff7a8 0%,#ffd23a 30%,#ff9a1a 70%,#ff6a00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:0;filter:drop-shadow(0 0 0 #000) drop-shadow(5px 7px 0 #000) drop-shadow(-3px -3px 0 #000) drop-shadow(3px -3px 0 #000) drop-shadow(-3px 4px 0 #000)}
#cx{position:relative;z-index:1;margin-top:18px;transform:skewX(-8deg) rotate(-3deg);background:linear-gradient(#2a0f14,#140608);border:6px solid #e0262b;
  box-shadow:6px 7px 0 #000;padding:6px 28px 4px}
#cx span{display:block;font-family:Anton,sans-serif;font-size:var(--fc,78px);color:#fff;text-transform:uppercase;line-height:1.05;-webkit-text-stroke:2px #000;paint-order:stroke fill}
#seta{position:absolute;z-index:2;width:290px;height:176px;bottom:6px;right:560px;overflow:visible}
.lado-esq #seta{right:auto;left:560px;transform:scaleX(-1)}
/* selo: adesivo redondo de chamada (NUOVO, SEGRETO, 😱 …) em cima da foto */
#selo{position:absolute;z-index:3;top:200px;left:300px;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff5a5a,#e0101a 60%,#a30008);
  border:9px solid #fff;box-shadow:0 0 0 7px #000,8px 10px 0 7px #000;display:flex;align-items:center;justify-content:center;transform:rotate(-12deg);text-align:center}
#selo span{display:block;width:166px;font-family:Anton,"Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:var(--fs,64px);line-height:.95;color:#fff;text-transform:uppercase;-webkit-text-stroke:3px #000;paint-order:stroke fill;overflow-wrap:normal}
#selo.emoji span{-webkit-text-stroke:0}
.lado-esq #selo{left:auto;right:300px;transform:rotate(12deg)}
/* estilo METAL */
.metal #pincel{display:none}
.metal #l1{background:linear-gradient(180deg,#ffffff 0%,#d9dde3 35%,#8d949e 52%,#eef1f4 70%,#9aa1aa 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:0;text-shadow:none;filter:drop-shadow(5px 6px 0 #000) drop-shadow(-3px -3px 0 #000) drop-shadow(3px -3px 0 #000) drop-shadow(-3px 3px 0 #000)}
.metal #cx{background:linear-gradient(90deg,#b3121a,#e3262c 60%,#b3121a);border:5px solid #111;transform:skewX(-12deg) rotate(-3deg)}
.metal #luz{background:radial-gradient(ellipse at 30% 45%,rgba(255,120,170,.22),transparent 55%),
  linear-gradient(to var(--lado-sombra,right),transparent 30%,rgba(25,5,40,.65) 68%,rgba(15,3,25,.85))}
/* estilo VICE (neon) */
.vice #pincel{display:none}
.vice #l1{color:#fff;-webkit-text-stroke:10px #3a0a5c;text-shadow:0 0 18px #ff4fd8,0 6px 0 #3a0a5c}
.vice #l2{background:linear-gradient(180deg,#ffe36b 0%,#ff9b3d 40%,#ff3fa4 80%,#c42bd6 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(5px 7px 0 #2a0640) drop-shadow(-3px -3px 0 #2a0640) drop-shadow(3px -3px 0 #2a0640) drop-shadow(-3px 4px 0 #2a0640) drop-shadow(0 0 22px rgba(255,80,200,.7))}
.vice #cx{background:#14e3f0;border:5px solid #2a0640;box-shadow:7px 7px 0 #ff3fa4}
.vice #cx span{color:#120420;-webkit-text-stroke:0}
.vice #luz{background:linear-gradient(180deg,rgba(255,60,170,.18),rgba(120,40,200,.25)),linear-gradient(to var(--lado-sombra,right),transparent 35%,rgba(40,6,70,.7) 75%)}
</style></head>
<body>
<div id="cena"></div><div id="luz"></div>
<img id="logo" alt="">
<div id="bloco">
  <svg id="pincel" viewBox="0 0 700 580" preserveAspectRatio="none"></svg>
  <div class="t" id="l1"></div>
  <div class="t" id="l2"></div>
  <div id="cx"><span></span></div>
</div>
<div id="selo"><span></span></div>
<svg id="seta" viewBox="0 0 330 200">
  <path d="M310 40 C 250 175, 120 190, 50 120" fill="none" stroke="#000" stroke-width="40" stroke-linecap="round"/>
  <path d="M310 40 C 250 175, 120 190, 50 120" fill="none" stroke="#ff1f1f" stroke-width="26" stroke-linecap="round"/>
  <polygon points="10,95 95,70 80,160" fill="#ff1f1f" stroke="#000" stroke-width="8" stroke-linejoin="round"/>
</svg>
<script>
// dados no hash: {foto, l1, l2, caixa, estilo:"pincel"|"metal"|"vice", lado:"dir"|"esq" (lado do TEXTO), pos, seta:true/false, logo}
const d = JSON.parse(decodeURIComponent(location.hash.slice(1) || '{}'));
document.body.className = (d.estilo || 'pincel') + (d.lado === 'esq' ? ' lado-esq' : '');
const cena = document.getElementById('cena');
cena.style.backgroundImage = `url("${d.foto}")`;
if (d.pos) cena.style.setProperty('--pos', d.pos);
document.documentElement.style.setProperty('--lado-sombra', d.lado === 'esq' ? 'left' : 'right');
document.documentElement.style.setProperty('--luz-x', d.lado === 'esq' ? '70%' : '30%');
const logo = document.getElementById('logo');
if (d.logo) logo.src = d.logo; else logo.remove();
document.getElementById('l1').textContent = d.l1 || '';
document.getElementById('l2').textContent = d.l2 || '';
const cx = document.getElementById('cx');
if (d.caixa) cx.querySelector('span').textContent = d.caixa; else cx.remove();
if (d.seta === false) document.getElementById('seta').remove();
const selo = document.getElementById('selo');
if (d.selo) selo.querySelector('span').textContent = d.selo; else selo.remove();
// pincel: mancha preta com bordas irregulares (semente fixa = sempre igual pro mesmo texto)
let s = [...(d.l1 + d.l2)].reduce((a, c) => a * 31 + c.charCodeAt(0) >>> 0, 7);
const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
const pts = [];
for (let x = 20; x <= 680; x += 22) pts.push([x, 40 + rnd() * 60]);
for (let y = 60; y <= 520; y += 26) pts.push([660 + rnd() * 40, y]);
for (let x = 680; x >= 20; x -= 22) pts.push([x, 480 + rnd() * 70]);
for (let y = 520; y >= 60; y -= 26) pts.push([rnd() * 45, y]);
const svg = document.getElementById('pincel');
svg.innerHTML = `<polygon points="${pts.map(p => p.join(',')).join(' ')}" fill="#050505" transform="rotate(-3 350 290)"/>` +
  Array.from({length: 14}, () => `<rect x="${rnd()*600}" y="${rnd()<.5? 25+rnd()*30 : 520+rnd()*40}" width="${30+rnd()*90}" height="${4+rnd()*8}" fill="#050505" transform="rotate(-3 350 290)"/>`).join('');
// ajusta o tamanho pra caber na largura do bloco
async function ajustar() {
  await document.fonts.ready;
  const img = new Image(); img.src = d.foto; await img.decode().catch(() => {});
  if (d.logo) await logo.decode().catch(() => {});
  const W = 600, root = document.documentElement.style;
  for (const [id, v, min] of [['l1', 104, 54], ['l2', 210, 90]]) {
    let f = v; const el = document.getElementById(id);
    root.setProperty(id === 'l1' ? '--f1' : '--f2', f + 'px');
    while (el.scrollWidth > W && f > min) { f -= 4; root.setProperty(id === 'l1' ? '--f1' : '--f2', f + 'px'); }
  }
  if (d.selo) { const sp = selo.querySelector('span'); const so = !/[A-Za-z0-9]/.test(d.selo);
    if (so) selo.classList.add('emoji');
    let f = so ? 118 : 70; root.setProperty('--fs', f + 'px');
    while ((sp.scrollWidth > 168 || sp.scrollHeight > 160) && f > 30) { f -= 3; root.setProperty('--fs', f + 'px'); } }
  if (d.caixa) { let f = 78; while (cx.offsetWidth > 560 && f > 40) { f -= 3; root.setProperty('--fc', f + 'px'); } }
  document.title = 'ok';
}
ajustar();
</script>
</body></html>
