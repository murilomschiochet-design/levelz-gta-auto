<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(fonts/Anton-Regular.ttf)}
@font-face{font-family:Inter;src:url(fonts/Inter.ttf);font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent;overflow:hidden;font-family:Inter,sans-serif}
/* mesmo estilo A (vidro escuro) do Área Pequeña, com as cores do GTA VI */
.card{position:absolute;left:60px;width:960px;top:170px;background:rgba(14,10,22,.55);border:2px solid rgba(255,255,255,.16);border-radius:44px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.photo{width:100%;height:520px;object-fit:cover;object-position:50% 30%;display:block;border-radius:28px;background:#1a1424}
.tag{display:inline-flex;align-items:center;gap:14px;font:800 30px Inter;letter-spacing:.12em;text-transform:uppercase;color:#fff;margin:34px 10px 18px}
.dot{width:16px;height:16px;border-radius:50%;background:#ff4fa3;box-shadow:0 0 0 6px rgba(255,79,163,.28)}
h1{font-family:Anton,sans-serif;font-weight:400;text-transform:uppercase;line-height:1.02;color:#fff;font-size:84px;margin:0 10px 24px}
h1 em{font-style:normal;color:#ffb347}
p{font-weight:500;line-height:1.42;color:rgba(255,255,255,.92);font-size:37px;margin:0 10px}
p b{font-weight:800;color:#ffb347}
.cta{font:800 30px Inter;letter-spacing:.06em;text-transform:uppercase;margin:30px 10px 6px;color:#fff;display:flex;justify-content:space-between;align-items:center;border-top:2px solid rgba(255,255,255,.16);padding-top:26px}
.cta span{background:linear-gradient(90deg,#ff4fa3,#ff8a3d);padding:12px 22px;border-radius:999px}
.credito{position:absolute;right:20px;top:488px;font:600 18px Inter;color:rgba(255,255,255,.85);background:rgba(0,0,0,.45);padding:4px 10px;border-radius:8px}
</style></head>
<body>
<div class="card" id="card"></div>
<script>
// dados no hash: #<json> {foto, posicao, tag, titulo, texto, credito, canal}
const d = JSON.parse(decodeURIComponent(location.hash.slice(1) || '{}'));
const esc = s => String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;');
const titulo = esc(d.titulo).replace(/\*([^*]+)\*/g, '<em>$1</em>');   // *parola* = destaque laranja
const texto = esc(d.texto).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');   // **nome** = destaque
const c = document.getElementById('card');
c.innerHTML = `<div style="position:relative">${d.foto ? `<img class="photo" src="${d.foto}" style="object-position:${esc(d.posicao || '50% 30%')}">` : '<div class="photo"></div>'}${d.credito ? `<div class="credito">📷 ${esc(d.credito)}</div>` : ''}</div>
<div class="tag"><span class="dot"></span>${esc(d.tag || 'Curiosità GTA 6')}</div>
<h1>${titulo}</h1><p>${texto}</p>
<div class="cta">${esc(d.canal || 'Altre curiosità ogni giorno')} <span>${esc(d.botao || 'Iscriviti 🔔')}</span></div>`;
const LIMITE = 1560;
const h1 = c.querySelector('h1'), p = c.querySelector('p'), ph = c.querySelector('.photo');
function cabe(){ return c.getBoundingClientRect().bottom <= LIMITE; }
async function ajustar(){
  await document.fonts.ready;
  const img = c.querySelector('img'); if (img && !img.complete) await new Promise(r => { img.onload = img.onerror = r; });
  let t = 84, s = 37, f = 520;
  while (!cabe() && t > 62) { t -= 2; h1.style.fontSize = t + 'px'; }
  while (!cabe() && f > 380) { f -= 20; ph.style.height = f + 'px'; }
  while (!cabe() && s > 28) { s -= 1; p.style.fontSize = s + 'px'; }
  document.title = cabe() ? 'ok' : 'grande';
}
ajustar();
</script>
</body></html>
