# 27/11: repositório público (minutos do Actions sem limite).
# Quando a rotina do Claude manda um roteiro novo (roteiros/dia-XX.json), gera os cards e sobe AGENDADO no @LevelzIT.
# À mão: Actions > "Cards - gerar e subir" > Run workflow (escolhendo o dia e se sobe ou não).
# Legendas + videos pro TikTok: pagina lz-legendas (CLOUDFLARE_API_TOKEN). TikTok pela API desligado (atrasava e duplicava).
name: Cards - gerar e subir

on:
  push:
    branches: [main]
    paths: ["roteiros/dia-*.json", ".github/workflows/cards.yml"]
  workflow_dispatch:
    inputs:
      dia:
        description: "Dia (ex.: dia-03). Vazio = o último roteiro"
        required: false
      subir:
        description: "Subir no YouTube?"
        type: choice
        options: ["sim", "nao"]
        default: "sim"

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONIOENCODING: utf-8
      USAR_PLAYWRIGHT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg e fontes
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji >/dev/null
          mkdir -p ~/.fonts && cp modelo/fonts/*.ttf ~/.fonts/ && fc-cache -f >/dev/null
      - name: Instalar bibliotecas
        run: |
          python -m pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium >/dev/null
      - name: Qual dia
        id: dia
        run: |
          DIA="${{ github.event.inputs.dia }}"
          [ -z "$DIA" ] && DIA=$(ls roteiros/dia-*.json | sort -V | tail -1 | xargs basename | sed 's/.json//')
          echo "dia=$DIA" >> "$GITHUB_OUTPUT"
          echo "Dia: $DIA"
      - name: Gameplay do dia (biblioteca do painel de cortes - 5 shorts + 1 longo)
        continue-on-error: true
        run: python gameplay.py incluir ${{ steps.dia.outputs.dia }}
      - name: Shorts de curiosidade (cenas da gameplay + voz + legenda no meio)
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p saida/${{ steps.dia.outputs.dia }}
          python curiosita.py ${{ steps.dia.outputs.dia }} 2>&1 | tee saida/${{ steps.dia.outputs.dia }}/_log-curiosita.txt
      - name: Gerar cards
        run: |
          set -o pipefail
          mkdir -p saida/${{ steps.dia.outputs.dia }}
          python gerar.py ${{ steps.dia.outputs.dia }} 2>&1 | tee saida/${{ steps.dia.outputs.dia }}/_log-cards.txt
          python folha_contato.py ${{ steps.dia.outputs.dia }} || echo "folha de contato pulada (dia sem cards)"
      - name: Gerar video longo (se o roteiro tiver)
        continue-on-error: true
        run: |
          set -o pipefail
          python longo/gerar_longo.py ${{ steps.dia.outputs.dia }} 2>&1 | tee saida/${{ steps.dia.outputs.dia }}/_log-longo.txt
      - name: Subir no YouTube (agendado)
        if: ${{ github.event.inputs.subir != 'nao' }}
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ -z "$YT_REFRESH_TOKEN" ]; then echo "Sem chave do YouTube ainda: pulei o upload."; exit 0; fi
          set -o pipefail
          python subir.py ${{ steps.dia.outputs.dia }} 2>&1 | tee saida/${{ steps.dia.outputs.dia }}/_log-subir.txt
      - name: Longo que nao subiu volta pra biblioteca
        if: always()
        continue-on-error: true
        run: python gameplay.py conferir ${{ steps.dia.outputs.dia }}
      - name: Instagram (sobe os Reels sem publicar; publica na hora certa o workflow 3-instagram)
        continue-on-error: true
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if [ -z "$IG_TOKEN" ]; then echo "Sem chave do Instagram: pulei."; exit 0; fi
          python instagram.py preparar ${{ steps.dia.outputs.dia }} 2>&1 | tee saida/${{ steps.dia.outputs.dia }}/_log-instagram.txt
      - name: TikTok (cards como rascunho)
        continue-on-error: true
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_CHAVE: ${{ secrets.TIKTOK_CHAVE }}
        run: |
          # desligado em 14/11: na conta do Levelz a caixa de entrada atrasava horas e duplicava. Os vídeos vão na página lz-legendas (botão Enviar pro TikTok).
          if [ "${{ vars.TIKTOK_API_LEVELZ }}" != "1" ]; then echo "TikTok pela API desligado: use a pagina lz-legendas."; exit 0; fi
          if [ -z "$TIKTOK_CHAVE" ]; then echo "Sem chave do TikTok: pulei."; exit 0; fi
          python tiktok.py ${{ steps.dia.outputs.dia }} 2>&1 | tee saida/${{ steps.dia.outputs.dia }}/_log-tiktok.txt
      - name: Pagina de legendas do TikTok (lz-legendas.pages.dev)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 52b6bb474d2f430ceddd01ef2a1ccf32
        run: |
          # pausado em 26/11 a pedido do Murilo (TikTok parado). Para religar: variável do repositório PAGINA_LEGENDAS=1.
          if [ "${{ vars.PAGINA_LEGENDAS }}" != "1" ]; then echo "Pagina de legendas do TikTok pausada."; exit 0; fi
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "Sem token do Cloudflare: pulei a pagina."; exit 0; fi
          python legendas_pagina.py ${{ steps.dia.outputs.dia }}
          npx -y wrangler@4 pages deploy site-legendas --project-name lz-legendas --branch main --commit-dirty=true
      - name: Guardar os videos pra conferir (3 dias)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dia.outputs.dia }}
          path: |
            saida/${{ steps.dia.outputs.dia }}/*.mp4
            saida/${{ steps.dia.outputs.dia }}/longo-thumb.jpg
            saida/${{ steps.dia.outputs.dia }}/*.jpg
            saida/${{ steps.dia.outputs.dia }}/painel.html
          retention-days: 3
      - name: Salvar registros
        if: always()
        run: |
          git config user.name "levelz-bot"
          git config user.email "levelz-bot@users.noreply.github.com"
          git add saida uso-fotos.json tiktok_token.enc roteiros gameplay/*.json 2>/dev/null || true
          git diff --cached --quiet && { echo "nada novo"; exit 0; }
          git commit -q -m "cards ${{ steps.dia.outputs.dia }}: registros"
          git pull --rebase -q
          git push
