# 3) A cada 15 min (08:00–21:45 Roma no inverno; o GitHub às vezes atrasa): publica no Instagram os Reels já preparados cujo horário chegou.
name: 3 - Instagram (publicar na hora)

on:
  schedule:
    - cron: "*/15 7-20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q tzdata
      - name: Publicar o que chegou na hora
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if [ -z "$IG_TOKEN" ]; then echo "Sem chave do Instagram."; exit 0; fi
          python instagram.py publicar
      - name: Salvar registro
        run: |
          git config user.name "instagram-bot"
          git config user.email "instagram-bot@users.noreply.github.com"
          git add saida/*/instagram.json 2>/dev/null || true
          git diff --cached --quiet && { echo "nada novo"; exit 0; }
          git commit -q -m "instagram: publicados"
          git pull --rebase -q
          git push
